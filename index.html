<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live on April 2nd, 2026</title>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #eae6da;
      background-image: 
        radial-gradient(circle at 25% 25%, rgba(255,255,255,0.05) 0%, transparent 100%),
        radial-gradient(circle at 75% 75%, rgba(0,0,0,0.03) 0%, transparent 100%),
        repeating-linear-gradient(
          45deg,
          rgba(0,0,0,0.015) 0px,
          rgba(0,0,0,0.015) 1px,
          transparent 1px,
          transparent 2px
        );
      background-blend-mode: multiply;
      font-family: "Playfair Display", Georgia, serif;
      color: #111;
      text-align: center;
    }

    .date {
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.1;
      padding: 0 1rem;
    }
  </style>
</head>

<body>
  <div class="date">Live on April 2nd, 2026</div>
</body>
</html>
